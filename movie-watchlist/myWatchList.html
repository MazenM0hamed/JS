<html>
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Browse movies and build your own watchlist by adding the movies you want to watch."
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <div class="header-content">
        <h1>My Watchlist</h1>
        <h3><a href="index.html">Search for movies</a></h3>
      </div>
    </header>
    <div class="search-container">
      <div class="search-bar">
        <div class="input-wrapper">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input
            type="text"
            name="search"
            placeholder="Search for a movie "
          />
        </div>
        <button>Search</button>
      </div>
    </div>
    <div class="empty-watchlist" id="empty-watchlist">
        <h4>Your watchlist is looking a little empty...</h4>
        <p><a href="index.html"><i class="fa-solid fa-plus"></i> Let's add some movies!</a></p>
    </div>
    <div class="watchlist-movies"></div>
    <script src="index.js" type="module"></script>
  </body>
</html>
